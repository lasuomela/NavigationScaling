# @package _global_

defaults:
  - /experiments/model_ablations/train_base
  - /model: mlp
  - _self_

earthrovers:

  model:
    encoder_type: facebook/dinov3-vitb16-pretrain-lvd1689m

  dataloader:
    batch_size: 64

  trainer:
    wandb:
      run_name: dino3_${earthrovers.model.type}_nLoc${earthrovers.dataloader.train_num_locations}_nH${earthrovers.dataloader.train_max_hours_per_location}