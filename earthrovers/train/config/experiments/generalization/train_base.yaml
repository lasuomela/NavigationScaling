# @package _global_

defaults:
  - /trainer: base
  - /dataloader: base
  - /model: mlp
  - _self_

earthrovers:

  dataloader:
    train_num_locations: -1
    train_min_hours_per_location: -1
    train_max_hours_per_location: -1
    val_max_rides_per_location: 50

  trainer:
    wandb:
      group: generalization
      run_name: ${earthrovers.model.type}_nLoc${earthrovers.dataloader.train_num_locations}_nH${earthrovers.dataloader.train_max_hours_per_location}